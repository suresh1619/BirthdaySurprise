<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Celebrate Under Lanterns</title>
  
  <audio id="violinMusic" preload="auto">
    <source src="music/oy_violin_bgm.mp3" type="audio/mpeg">
  </audio>
  <audio id="loveMusic" preload="auto" loop>
    <source src="music/oy_love.mp3" type="audio/mpeg">
  </audio>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #0c0a1a 0%, #1e1a3a 40%, #2d2662 100%);
      min-height: 100vh;
      font-family: 'Dancing Script', cursive;
      overflow-x: hidden;
      position: relative;
    }
    
    .ambient-glow {
      position: fixed; width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, rgba(255,200,140,0.25) 0%, rgba(255,140,60,0.08) 50%, transparent 75%);
      border-radius: 50%; filter: blur(50px); pointer-events: none; z-index: 1;
      animation: drift 24s infinite alternate ease-in-out;
    }
    .glow-top { top: 5%; left: -5%; }
    .glow-bottom { bottom: 0%; right: -5%; background: radial-gradient(circle, rgba(255,182,193,0.2) 0%, transparent 70%); }
    
    @keyframes drift {
      0% { transform: translate(-10%, -10%) scale(1); opacity: 0.5; }
      100% { transform: translate(15%, 15%) scale(1.3); opacity: 0.8; }
    }
    
    .star-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none; overflow: hidden;
    }
    .star {
      position: absolute; width: 4px; height: 4px;
      background: white; border-radius: 50%;
      box-shadow: 0 0 12px 2px rgba(255,255,200,0.9);
      opacity: 0.7; animation: twink 4s infinite alternate;
    }
    @keyframes twink {
      0% { opacity: 0.1; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    .shooting-star {
      position: absolute; width: 150px; height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,215,0,0.8) 30%, rgba(255,255,255,0) 100%);
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
      transform-origin: left center; opacity: 0; z-index: 1;
    }

    .moon {
      position: fixed; top: 40px; right: 60px; width: 60px; height: 60px;
      background: transparent; border-radius: 50%;
      z-index: 1; filter: blur(1px);
      animation: moonPulse 6s infinite alternate ease-in-out;
    }
    @keyframes moonPulse {
      0% { box-shadow: 15px 15px 0 5px #fff3c9, 0 0 30px #ffd966, 0 0 50px rgba(255, 182, 193, 0.1); }
      100% { box-shadow: 15px 15px 0 5px #fff3c9, 0 0 45px #ffea99, 0 0 80px rgba(255, 182, 193, 0.3); }
    }

    #interactive-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;
    }
    #ocean-bottom {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 15vh;
      background: linear-gradient(to bottom, rgba(12, 10, 26, 0) 0%, rgba(12, 10, 26, 0.7) 100%);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 5; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .moon-reflection {
      position: absolute; top: -10px; right: 100px; width: 80px; height: 120%;
      background: linear-gradient(to bottom, rgba(255,217,102,0.3) 0%, rgba(255,217,102,0.05) 100%);
      filter: blur(10px); transform: rotate(-5deg); pointer-events: none;
    }

    .ripple {
      position: absolute; border-radius: 50%; border: 1px solid rgba(255, 215, 0, 0.5);
      transform: translate(-50%, -50%); animation: rippleEffect 1.5s ease-out forwards; pointer-events: none;
    }
    @keyframes rippleEffect {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 150px; height: 40px; opacity: 0; }
    }

    .magic-lantern-btn {
      position: relative; margin: 2rem auto; width: fit-content;
      background: rgba(30, 20, 45, 0.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 2px solid #fbbf24; border-radius: 60px 60px 30px 30px;
      padding: 1.2rem 3rem; box-shadow: 0 0 50px #f59e0b, 0 0 120px #fbbf24 inset;
      cursor: pointer; transition: 0.3s; z-index: 20;
      animation: float-lantern 3s infinite alternate; text-align: center;
    }
    .magic-lantern-btn:hover {
      transform: translateY(-5%) scale(1.05); background: rgba(80, 50, 100, 0.7);
      border-color: #ffd966; box-shadow: 0 0 80px #ffaa33, 0 0 160px #ffeeaa inset;
    }
    .lantern-text { font-size: 2.8rem; color: #fff3c9; text-shadow: 0 0 15px gold, 0 0 40px orange; letter-spacing: 6px; }
    .sub-lantern { font-size: 1.2rem; color: #fde68a; font-family: sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    @keyframes float-lantern { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }

    #scary-popup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 20000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #scaryVideo {
      width: 90%; max-width: 800px; max-height: 60vh;
      object-fit: contain; border: 2px solid #500;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.4); 
      margin-bottom: 2rem; border-radius: 8px;
    }
    #tryAgainBtn {
      background: transparent; border: 1px solid #ff1a1a; color: #ff1a1a;
      font-family: monospace; font-size: 1.5rem; padding: 12px 40px;
      cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 6px;
    }
    #tryAgainBtn:hover {
      background: #ff1a1a; color: #000; box-shadow: 0 0 25px #ff1a1a;
    }

    #reel-popup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 30000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .reel-container {
      width: 90%; max-width: 400px; 
      aspect-ratio: 9 / 16; 
      border-radius: 16px; overflow: hidden;
      border: 2px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
      position: relative; background: #000;
    }
    .reel-container video {
      width: 100%; height: 100%;
      object-fit: cover; 
    }
    .close-reel-btn {
      position: absolute; top: 20px; right: 25px;
      color: #fff; font-size: 2.5rem; cursor: pointer; z-index: 30001;
      text-shadow: 0 0 10px rgba(0,0,0,0.8); transition: color 0.3s;
      font-family: monospace;
    }
    .close-reel-btn:hover { color: #fbbf24; }
    
    #lantern-page {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at 40% 50%, #1f1a47, #0d0823);
      z-index: 9999; display: none; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden;
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent;
    }
    .lantern-page-container {
      width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none; z-index: 10;
      overflow: hidden;
    }
    .close-btn {
      position: absolute; top: 25px; right: 35px; background: rgba(255,215,0,0.2);
      border: 2px solid #ffbb33; color: #ffdf99; font-size: 2rem; width: 60px; height: 60px;
      border-radius: 50%; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; font-family: monospace; pointer-events: auto;
    }
    .close-btn:hover { background: rgba(255,200,50,0.4); transform: scale(1.15); border-color: gold; color: white; }
    
    .happy-big {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-1deg);
      width: 95%; text-align: center; 
      font-size: clamp(2.5rem, 8vw, 6.5rem); 
      line-height: 1.2;
      color: #ffecbb;
      text-shadow: 0 0 20px #fbbf24, 0 0 60px #f97316, 0 0 100px #facc15;
      z-index: 50; letter-spacing: 4px; opacity: 0; pointer-events: none;
    }

    .float-object { position: absolute; transform-origin: center bottom; z-index: 10; will-change: transform; }
    .balloon-obj {
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2), inset 5px 5px 10px rgba(255,255,255,0.4);
    }
    .balloon-obj::after {
      content: ''; position: absolute; bottom: -25px; left: 50%;
      width: 1px; height: 25px; background: rgba(255, 255, 255, 0.6);
    }
    .lantern-obj {
      background: linear-gradient(145deg, #f7cf7c, #e5a141); border-radius: 40% 40% 30% 30%;
      box-shadow: 0 0 35px #ffb347, inset -5px -5px 10px #d1801f;
      animation: flicker 2s infinite alternate;
    }
    .lantern-obj::before {
      content: "🏮"; position: absolute; top: -20px; left: 15px; font-size: 26px; filter: drop-shadow(0 0 8px orange);
    }
    @keyframes flicker {
      0% { box-shadow: 0 0 25px rgba(247, 207, 124, 0.6), inset -5px -5px 10px rgba(229, 161, 65, 0.9); }
      100% { box-shadow: 0 0 45px rgba(247, 207, 124, 1), inset -5px -5px 15px rgba(229, 161, 65, 0.7); }
    }

    .wish-label {
      position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
      color: #fff3c9; font-size: 0.85rem; white-space: nowrap; font-family: sans-serif;
      text-shadow: 0 0 5px #000; font-weight: bold; pointer-events: none;
    }

    .reaction-wrapper {
      display: none; opacity: 0; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 60;
    }
    
    .glass-panel {
      background: rgba(30, 15, 5, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 191, 36, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 20px rgba(251, 191, 36, 0.15);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .glass-panel:hover {
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(251, 191, 36, 0.3);
      border-color: rgba(251, 191, 36, 0.8);
    }

    .reaction-frame {
      border-radius: 50%; object-fit: cover; 
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), inset 0 0 15px rgba(255,255,255,0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease; 
      border: 3px solid rgba(251, 191, 36, 0.8);
      position: relative;
    }
    .reaction-frame::after {
      content: ''; position: absolute; top:-5px; left:-5px; right:-5px; bottom:-5px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
      animation: spinBorder 4s linear infinite;
    }
    
    .product-frame {
      border: 4px solid #facc15;
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5), 0 0 40px rgba(245, 158, 11, 0.3); }
      100% { box-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 0 80px rgba(245, 158, 11, 0.6); }
    }

    .arrow-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 20px; }
    
    .arrow-line {
      height: 4px; width: 0px; 
      background: linear-gradient(90deg, transparent, #fbbf24, #fef08a, #fbbf24, transparent);
      background-size: 200% 100%;
      animation: flowingLight 1.5s linear infinite;
      border-radius: 2px; 
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.8), 0 0 30px rgba(245, 158, 11, 0.4);
    }
    @keyframes flowingLight { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    .dr-fudge-title { 
      font-family: 'Dancing Script', cursive; 
      background: linear-gradient(to right, #ffedd5, #fde68a, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(251,191,36,0.6));
    }
    .headline-text { font-family: 'Dancing Script', cursive; text-shadow: 0 0 35px #fbbf24, 0 0 70px #ff8800; }
    .catalyst-style { font-family: 'Dancing Script', cursive; text-shadow: 0 0 10px rgba(255,215,0,0.8); }
    
    .reactant-1, .reactant-2, .reactant-3, .catalyst-text, .arrow-head, .product { opacity: 0; }
    footer { text-align: center; color: rgba(255,255,240,0.4); font-family: sans-serif; font-size: 0.9rem; padding: 20px 0; z-index: 5; position: relative; pointer-events: none;}

    @media (max-width: 640px) {
      .reaction-wrapper { flex-direction: column; gap: 15px; }
      .arrow-container { transform: rotate(90deg); margin: 25px 0; }
      .dr-fudge-title { font-size: 2.2rem; }
      .reaction-frame { width: 75px; height: 75px; }
      .product-frame { width: 110px; height: 110px; }
      .close-btn { width: 45px; height: 45px; font-size: 1.2rem; top: 15px; right: 15px; }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center pt-10">

  <button id="surpriseBtn" class="fixed top-4 left-4 md:top-6 md:left-6 z-[100] bg-amber-600/20 hover:bg-amber-500/40 border border-amber-400/50 backdrop-blur-md text-amber-200 px-4 py-2 rounded-full font-sans text-sm md:text-base font-bold tracking-wider transition-all duration-300 shadow-[0_0_15px_rgba(251,191,36,0.3)] hover:shadow-[0_0_25px_rgba(251,191,36,0.6)] flex items-center gap-2">
    <span>🎁</span> Surprise
  </button>

  <div id="reel-popup">
    <div class="close-reel-btn" id="closeReelBtn">&times;</div>
    <div class="reel-container">
      <video id="reelVideo" src="images/dance_spoof.mp4" playsinline preload="auto" controls></video>
    </div>
  </div>

  <div id="scary-popup">
    <video id="scaryVideo" src="images/scary.mp4" playsinline preload="auto" controls></video>
    <button id="tryAgainBtn">TryAgain...</button>
  </div>

  <canvas id="interactive-canvas"></canvas>
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>
  
  <div class="moon"></div>
  <div id="main-stars" class="star-container z-0"></div>
  
  <div id="ocean-bottom">
    <div class="moon-reflection"></div>
  </div>

  <div class="z-10 flex flex-col items-center justify-center h-full mt-20 pointer-events-none">
    <h1 class="text-6xl md:text-8xl text-amber-300 drop-shadow-2xl text-center whitespace-nowrap headline-text">
      ATHAYYA ✨
    </h1>
    <p class="text-xl md:text-2xl text-amber-200/80 italic text-center mt-4 mb-16">Let's celebrate under lanterns</p>
    <div class="pointer-events-auto">
      <div class="magic-lantern-btn" id="lanternButton">
        <div class="lantern-text">🏮 &nbsp;Ignite&nbsp; 🏮</div>
        <div class="sub-lantern">to start celebration</div>
      </div>
    </div>
  </div>

  <footer class="mt-auto absolute bottom-4">made with 🕯️ and floating wishes ✨🎉✨</footer>

  <div id="lantern-page">
    <div class="close-btn" id="closeLanternPage">✕</div>
    <div id="lantern-stars" class="star-container z-0"></div>
    
    <div class="absolute bottom-10 text-amber-200/90 text-base font-semibold tracking-widest animate-pulse pointer-events-none z-50 drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]">
        Tap the sky to release a wish ✦
    </div>

    <div class="lantern-page-container" id="floatingObjectsContainer"></div>
    
    <div class="happy-big" id="celebrateHeadline"></div>

    <div class="reaction-wrapper flex flex-col md:flex-row items-center justify-center w-full max-w-5xl px-4 font-sans">
      <div class="flex items-center gap-4">
        <div class="reactant-1 relative group">
          <img src="images/mini.png" alt="Past Photo" class="reaction-frame w-16 h-16 md:w-24 md:h-24">
        </div>
        <span class="reactant-2 text-3xl md:text-5xl text-amber-300 font-light drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]">+</span>
        <div class="reactant-3 px-4 py-2 md:px-6 md:py-3 glass-panel">
          <span class="text-sm md:text-xl text-amber-100 tracking-widest uppercase font-bold drop-shadow-md">struggles</span>
        </div>
      </div>

      <div class="arrow-container my-4 md:my-0">
        <span class="catalyst-text text-sm md:text-xl text-amber-200 mb-2 md:mb-3 font-bold text-center tracking-wide catalyst-style">
          Catalyst: Elder daughter's pride
        </span>
        <div class="flex items-center text-amber-400">
          <div class="arrow-line md:max-w-[140px]"></div>
          <svg xmlns="http://www.w3.org/2000/svg" class="arrow-head h-8 w-8 md:h-10 md:w-10 -ml-2 drop-shadow-[0_0_12px_rgba(251,191,36,1)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </div>
      </div>

      <div class="product flex flex-col items-center">
        <span class="dr-fudge-title text-3xl md:text-5xl font-black tracking-wide mb-3 z-20">Afreen Shaik❣️</span>
        <div class="relative group">
          <img src="/images/big.jpeg" alt="Athayya big" class="reaction-frame product-frame w-24 h-24 md:w-40 md:h-40">
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const mediaElements = [
        document.getElementById('violinMusic'),
        document.getElementById('loveMusic'),
        document.getElementById('scaryVideo'),
        document.getElementById('reelVideo') 
      ];
      mediaElements.forEach(media => {
        if (media) {
          media.load(); 
        }
      });
    });

    const surpriseBtn = document.getElementById('surpriseBtn');
    const reelPopup = document.getElementById('reel-popup');
    const closeReelBtn = document.getElementById('closeReelBtn');
    const reelVideo = document.getElementById('reelVideo');

    surpriseBtn.addEventListener('click', () => {
      reelPopup.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      const playPromise = reelVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => console.error("Reel video playback prevented by browser:", error));
      }
    });

    closeReelBtn.addEventListener('click', () => {
      reelPopup.style.display = 'none';
      document.body.style.overflow = 'auto';
      reelVideo.pause();
      reelVideo.currentTime = 0; 
    });

    function createStars(containerId, count) {
      const container = document.getElementById(containerId);
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.width = (Math.random() * 5 + 2) + 'px'; star.style.height = star.style.width;
        container.appendChild(star);
      }
    }
    createStars('main-stars', 150); createStars('lantern-stars', 150);

    function shootStar() {
      setTimeout(shootStar, Math.random() * 5000 + 3000); 
      if (document.getElementById('lantern-page').style.display === 'flex' || 
          document.getElementById('scary-popup').style.display === 'flex' ||
          document.getElementById('reel-popup').style.display === 'flex') return; 

      const star = document.createElement('div');
      star.className = 'shooting-star';
      const startX = Math.random() * (window.innerWidth / 2) + (window.innerWidth / 4);
      const startY = Math.random() * (window.innerHeight / 3);
      const length = Math.random() * 100 + 150;
      const angle = 20 + Math.random() * 15; 
      
      star.style.left = startX + 'px'; star.style.top = startY + 'px';
      star.style.width = length + 'px'; star.style.transform = `rotate(${angle}deg)`;
      document.body.appendChild(star);
      
      gsap.fromTo(star, { opacity: 1, x: 0, y: 0, scaleX: 0 }, {
        opacity: 0, x: length * Math.cos(angle * (Math.PI / 180)) * 1.5,
        y: length * Math.sin(angle * (Math.PI / 180)) * 1.5,
        scaleX: 1, duration: 1.5 + Math.random() * 1, ease: "power2.out",
        onComplete: () => star.remove()
      });
    }
    setTimeout(shootStar, 2000);

    const cvs = document.getElementById('interactive-canvas');
    const ctx = cvs.getContext('2d');
    let cw = cvs.width = window.innerWidth;
    let ch = cvs.height = window.innerHeight;
    let mouse = { x: null, y: null };
    
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('resize', () => { cw = cvs.width = window.innerWidth; ch = cvs.height = window.innerHeight; });

    const constelRatios = [ {x:0.2, y:0.2}, {x:0.35, y:0.3}, {x:0.45, y:0.2}, {x:0.6, y:0.4}, {x:0.75, y:0.25}, {x:0.8, y:0.45} ];
    let fireflies = [];
    for(let i=0; i<30; i++) {
        fireflies.push({
            x: Math.random() * cw, y: Math.random() * ch,
            vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1,
            size: Math.random() * 2 + 1,
            hue: Math.random() > 0.5 ? 45 : 15 
        });
    }

    function drawInteractiveElements() {
        ctx.clearRect(0, 0, cw, ch);
        ctx.beginPath();
        ctx.moveTo(constelRatios[0].x * cw, constelRatios[0].y * ch);
        for(let i=1; i<constelRatios.length; i++) {
            ctx.lineTo(constelRatios[i].x * cw, constelRatios[i].y * ch);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1; ctx.stroke();
        
        constelRatios.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x * cw, p.y * ch, 2, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.fill();
        });

        fireflies.forEach(f => {
            f.x += f.vx; f.y += f.vy;
            if(f.x < 0 || f.x > cw) f.vx *= -1; if(f.y < 0 || f.y > ch) f.vy *= -1;
            if(mouse.x !== null) { let dx = mouse.x - f.x, dy = mouse.y - f.y; let dist = Math.sqrt(dx*dx + dy*dy); if(dist < 80) { f.x -= dx * 0.03; f.y -= dy * 0.03; } }
            ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${f.hue}, 100%, 70%, 0.8)`; 
            ctx.shadowBlur = 10; ctx.shadowColor = `hsla(${f.hue}, 100%, 60%, 1)`;
            ctx.fill(); ctx.shadowBlur = 0;
        });
        requestAnimationFrame(drawInteractiveElements);
    }
    drawInteractiveElements();

    document.getElementById('ocean-bottom').addEventListener('click', function(e) {
      if (e.target.className === 'moon-reflection') return; 
      let ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px'; ripple.style.top = e.clientY + 'px';
      document.getElementById('ocean-bottom').appendChild(ripple); 
      setTimeout(() => ripple.remove(), 1500);
    });

    (function() {
      const wishes = ["Happiness", "Great Health", "True Love", "Success", "puppies", "good kdramas", "Prosperity", "Mavayya", "Kindness", "music", "Laughter", "Confidence", "Grace", "Strength", "Mavayya", "Anime", "Wealth", "Creativity", "Patience", "Courage", "mavayya", "Harmonious Life", "Golden Dreams", "Smile Always", "Blessings", "Magic", "Serenity", "Brightness", "Victory", "Ambition", "Wonder", "Radiance" ];
      
      function getDisplayData() {
        if (window.innerWidth < 640) {
          return { lines: ['HAPPY', 'BIRTHDAY', 'ATHAYYA'], html: 'HAPPY<br>BIRTHDAY<br>ATHAYYA' };
        } else {
          return { lines: ['HAPPY BIRTHDAY', 'ATHAYYA'], html: 'HAPPY BIRTHDAY<br>ATHAYYA' };
        }
      }

      function getTextPoints(textArray) { 
        const canvas = document.createElement("canvas"); 
        const ctx = canvas.getContext("2d", { willReadFrequently: true }); 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
        ctx.fillStyle = "#000"; 
        
        // Tightly scale font so it clearly fits the screen horizontally
        const fontSize = window.innerWidth < 640 ? canvas.width / 5.5 : Math.max(60, Math.min(canvas.width / 10, 120)); 
        
        ctx.font = `900 ${fontSize}px "Segoe UI", Arial, sans-serif`; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle"; 
        
        const lines = textArray; 
        const lineHeight = fontSize * 1.1; 
        const totalHeight = lineHeight * lines.length; 
        const centerY = (canvas.height / 2) - (totalHeight - lineHeight) / 2; 
        
        lines.forEach((line, i) => { 
          ctx.fillText(line, canvas.width / 2, centerY + i * lineHeight); 
        }); 
        
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data; 
        const points = []; 
        
        // Much denser packing for more balloons and clearer text
        const step = window.innerWidth < 640 ? 7 : 6; 
        
        for (let y = 0; y < canvas.height; y += step) { 
          for (let x = 0; x < canvas.width; x += step) { 
            if (data[(y * canvas.width + x) * 4 + 3] > 128) { 
              points.push({ x: (x / canvas.width) * 100, y: (y / canvas.height) * 100 }); 
            } 
          } 
        } 
        return points; 
      }
      
      function shuffleArray(arr) { const array = [...arr]; for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }
      
      const state = { activeObjects: [], animationInterval: null, isAnimating: false, masterTimeline: null };
      const elements = { secondPage: document.getElementById('lantern-page'), container: document.getElementById('floatingObjectsContainer'), headline: document.getElementById('celebrateHeadline') };
      
      function launchCracker() {
        const container = elements.secondPage;
        const colors = ['#fde68a', '#f59e0b', '#fbbf24', '#facc15', '#ffffff', '#ff9999', '#99ff99', '#99ccff'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const startX = window.innerWidth * 0.1 + Math.random() * (window.innerWidth * 0.8);
        const targetY = Math.random() * (window.innerHeight * 0.4) + 50; 
        
        const rocket = document.createElement('div');
        rocket.className = 'absolute z-[70] rounded-full';
        rocket.style.width = '6px'; rocket.style.height = '30px';
        rocket.style.background = `linear-gradient(to bottom, #fff, ${color}, transparent)`;
        rocket.style.boxShadow = `0 -5px 15px ${color}`;
        rocket.style.left = startX + 'px'; rocket.style.top = window.innerHeight + 'px';
        container.appendChild(rocket);

        gsap.to(rocket, {
          top: targetY, duration: 1 + Math.random() * 0.5, ease: "power1.out",
          onComplete: () => {
            rocket.remove(); blastCracker(startX, targetY, color, container);
            let ripple = document.createElement('div'); ripple.className = 'ripple';
            ripple.style.left = startX + 'px'; ripple.style.top = '20px'; ripple.style.transform = 'translate(-50%, -50%) scale(1.5)';
            document.getElementById('ocean-bottom').appendChild(ripple); setTimeout(() => ripple.remove(), 1500);
          }
        });
      }

      function blastCracker(x, y, color, container) {
        const isMobile = window.innerWidth < 640;
        const particleCount = isMobile ? 25 + Math.floor(Math.random() * 15) : 80 + Math.floor(Math.random() * 30);
        
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'absolute z-[70] rounded-full';
          particle.style.width = isMobile ? '4px' : '5px'; 
          particle.style.height = isMobile ? '4px' : '5px';
          particle.style.backgroundColor = (Math.random() > 0.3 ? '#fff' : color);
          particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
          particle.style.left = x + 'px'; particle.style.top = y + 'px';
          container.appendChild(particle);

          const angle = Math.random() * Math.PI * 2;
          const velocity = (isMobile ? 50 : 80) + Math.random() * (isMobile ? 120 : 200);
          gsap.to(particle, {
            x: Math.cos(angle) * velocity, y: (Math.sin(angle) * velocity) + 120, opacity: 0, scale: 0.1,
            duration: 1 + Math.random() * 1, ease: "power2.out", onComplete: () => particle.remove()
          });
        }
      }
      
      // parent is optional: text balloons are added in one batch (DocumentFragment) to avoid layout thrashing
      function createBalloon(targetX, targetY, isLantern = false, isTextForming = false, wish = null, isTapped = false, parent = null) { 
        if (!elements.container) return; 
        const el = document.createElement('div'); 
        el.className = 'float-object ' + (isLantern ? 'lantern-obj' : 'balloon-obj'); 
        
        if (!isLantern) { 
          const hue = Math.floor(Math.random() * 360); 
          el.style.background = `linear-gradient(135deg, hsl(${hue}, 90%, 65%), hsl(${hue}, 85%, 50%))`; 
        } 
        if (wish) { 
          const wishSpan = document.createElement('span'); wishSpan.className = 'wish-label'; wishSpan.innerText = wish; el.appendChild(wishSpan); 
        } 
        
        let scale; 
        if (isTextForming) { 
            // Smaller balloons make the text much sharper and clearer!
            scale = window.innerWidth < 640 ? 0.25 : 0.3; 
        } 
        else if (isLantern) { scale = 0.8 + Math.random() * 0.4; } 
        else { scale = 1.0 + Math.random() * 0.6; } 
        
        el.style.width = (50 * scale) + 'px'; el.style.height = (65 * scale) + 'px'; 
        el.style.left = targetX + '%'; 

        if (isTextForming) {
          // FIX: the balloon is placed at its FINAL text position (top/left in %),
          // then pushed below the screen with a transform (y) and animated back up to y:0.
          // Animating a transform is reliable, GPU-friendly and can never "snap" to the final spot.
          el.style.top = targetY + '%';
          const vh = window.innerHeight;
          const targetPx = (targetY / 100) * vh;
          const startOffset = (vh - targetPx) + 100 + Math.random() * 200; // starts fully below the screen

          gsap.set(el, { y: startOffset, opacity: 1 });

          (parent || elements.container).appendChild(el);
          state.activeObjects.push(el);

          const tl = gsap.timeline({ onComplete: () => { el.remove(); } });
          tl.to(el, { y: 0, duration: 4.5 + Math.random() * 2, delay: Math.random() * 1.2, ease: 'power2.out' })   // slow rise from bottom
            .to(el, { y: -12, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 })                              // gentle hover
            .to(el, { y: -(targetPx + 250), x: (Math.random() * 20 - 10) * window.innerWidth / 100, opacity: 0, duration: 4 + Math.random() * 2, ease: 'power1.in' }); // drift away
          return;
        }

        el.style.top = isTapped ? targetY + '%' : '110%'; 
        
        (parent || elements.container).appendChild(el); state.activeObjects.push(el); 
        
        const tl = gsap.timeline({ onComplete: () => { el.remove(); }}); 
        if (isTapped) { 
          tl.to(el, { top: '-20%', left: targetX + (Math.random() * 10 - 5) + '%', opacity: 0, duration: 6 + Math.random() * 3, ease: 'power1.out' }); 
        } else { 
          tl.to(el, { top: '-30%', left: targetX + (Math.random() * 20 - 10) + '%', opacity: 0, duration: 10 + Math.random() * 6, ease: 'none' }); 
        } 
        gsap.to(el, { rotation: Math.random() * 10 - 5, duration: 2 + Math.random() * 2, repeat: -1, yoyo: true, ease: 'sine.inOut' }); 
      }
      
      function startCelebrationSequence() { 
        if (state.isAnimating) return; state.isAnimating = true; 
        
        const displayData = getDisplayData();
        elements.headline.innerHTML = displayData.html;
        
        gsap.set("#celebrateHeadline", { opacity: 0 }); 
        gsap.set(".reaction-wrapper", { display: "none", opacity: 0 }); 
        gsap.set([".reactant-1", ".reactant-2", ".reactant-3", ".catalyst-text", ".arrow-head", ".product"], { opacity: 0 }); 
        gsap.set(".arrow-line", { width: 0 }); 
        
        const textPoints = shuffleArray(getTextPoints(displayData.lines)); 
        const fragment = document.createDocumentFragment();
        textPoints.forEach(point => createBalloon(point.x, point.y, false, true, null, false, fragment));
        elements.container.appendChild(fragment);
        
        if (state.animationInterval) clearInterval(state.animationInterval); 
        state.animationInterval = setInterval(() => { 
          if (!state.isAnimating) return; 
          createBalloon(5 + Math.random() * 90, -10, Math.random() > 0.5, false); 
        }, 800); 
        
        state.masterTimeline = gsap.timeline(); 
        state.masterTimeline 
          .to("#celebrateHeadline", { opacity: 1, duration: 2, ease: "power2.inOut", delay: 8 }) 
          .to("#celebrateHeadline", { opacity: 0, duration: 1.5, ease: "power2.inOut", delay: 3 }) 
          
          .set(".reaction-wrapper", { display: "flex", opacity: 1 }) 
          .fromTo(".reactant-1", { scale: 0.5, opacity: 0, rotation: -15 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: "back.out(1.5)" }) 
          .fromTo(".reactant-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, "+=0.2") 
          .fromTo(".reactant-3", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, "+=0.2") 
          .fromTo(".catalyst-text", { y: -20, opacity: 0, filter: "blur(5px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power2.out" }, "+=0.4") 
          
          .to(".arrow-line", { width: window.innerWidth < 768 ? "70px" : "140px", duration: 1.2, ease: "power2.inOut" }) 
          .fromTo(".arrow-head", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, "-=0.3") 
          
          .fromTo(".product", { scale: 0.2, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 1.5, ease: "elastic.out(1, 0.4)" }, "+=0.4") 
          
          .call(() => {
             let fwCount = 0;
             const isMobile = window.innerWidth < 640;
             const fwInterval = setInterval(() => {
               launchCracker(); 
               if (!isMobile && Math.random() > 0.3) launchCracker(); 
               fwCount++; 
               if (fwCount > (isMobile ? 5 : 10)) clearInterval(fwInterval);
             }, isMobile ? 600 : 350);
          })
          
          .to(".reaction-wrapper", { y: -15, duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut" }, "+=0.5"); 
      }
      
      function stopEverything() { 
        state.isAnimating = false; 
        if (state.animationInterval) clearInterval(state.animationInterval); state.animationInterval = null; 
        if (state.masterTimeline) state.masterTimeline.kill(); 
        state.activeObjects.forEach(obj => { gsap.killTweensOf(obj); obj.remove(); }); 
        state.activeObjects = []; 
      }
      
      let hasBeenPranked = false;

      function triggerRealCelebration() {
        elements.secondPage.style.display = 'flex'; 
        document.body.style.overflow = 'hidden'; 
        
        const violinMusic = document.getElementById('violinMusic'); 
        const loveMusic = document.getElementById('loveMusic'); 
        
        violinMusic.currentTime = 0; 
        loveMusic.currentTime = 0; 
        
        const playPromise = violinMusic.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.error("Audio playback failed. Please verify that 'music/oy_violin_bgm.mp3' exists in your directory.", error);
          });
        }
        
        violinMusic.onended = () => { 
          loveMusic.play().catch(e => console.error("Love music failed to play:", e)); 
        }; 
        
        // Wait until the lantern page is actually laid out and painted before creating balloons,
        // so the rise-from-bottom animation starts from a proper first frame.
        requestAnimationFrame(() => requestAnimationFrame(startCelebrationSequence));
      }

      document.getElementById('lanternButton').addEventListener('click', () => { 
        if (!hasBeenPranked) {
          const scaryPopup = document.getElementById('scary-popup');
          const scaryVideo = document.getElementById('scaryVideo');
          scaryPopup.style.display = 'flex'; document.body.style.overflow = 'hidden';
          scaryVideo.play();
        } else {
          triggerRealCelebration();
        }
      });

      document.getElementById('tryAgainBtn').addEventListener('click', () => {
        hasBeenPranked = true; 
        const scaryPopup = document.getElementById('scary-popup');
        const scaryVideo = document.getElementById('scaryVideo');
        scaryVideo.pause(); scaryVideo.currentTime = 0;
        scaryPopup.style.display = 'none';
        triggerRealCelebration();
      });

      let lastTapTime = 0;
      
      function releaseWishLantern(e) { 
        if (e.target.id === 'closeLanternPage') return; 

        const currentTime = new Date().getTime();
        if (currentTime - lastTapTime < 300) return;
        lastTapTime = currentTime;

        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if (e.type === 'touchstart') {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        const x = (clientX / window.innerWidth) * 100; 
        const y = (clientY / window.innerHeight) * 100; 
        const wishText = wishes[Math.floor(Math.random() * wishes.length)]; 
        
        createBalloon(x, y, true, false, wishText, true); 
      }

      elements.secondPage.addEventListener('click', releaseWishLantern);
      elements.secondPage.addEventListener('touchstart', (e) => {
         if (e.target.id !== 'closeLanternPage') {
             e.preventDefault(); 
         }
         releaseWishLantern(e);
      }, { passive: false });
      
      document.getElementById('closeLanternPage').addEventListener('click', () => { 
        const violinMusic = document.getElementById('violinMusic'); const loveMusic = document.getElementById('loveMusic'); 
        violinMusic.pause(); loveMusic.pause(); 
        elements.secondPage.style.display = 'none'; document.body.style.overflow = 'auto'; 
        stopEverything(); 
      });
      
      window.addEventListener('keydown', (e) => { 
        if (e.key === 'Escape' && elements.secondPage.style.display === 'flex') { 
          const violinMusic = document.getElementById('violinMusic'); const loveMusic = document.getElementById('loveMusic'); 
          violinMusic.pause(); loveMusic.pause(); 
          elements.secondPage.style.display = 'none'; document.body.style.overflow = 'auto'; 
          stopEverything(); 
        }
      });
    })();
  </script>
